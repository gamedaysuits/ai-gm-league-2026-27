[project]
name = "gmbench-media"
version = "0.1.0"
description = "GM-Bench Draft Night / weekly show pipeline: ledger -> rundown -> TTS -> mix -> avatars -> HyperFrames render"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pillow>=11.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.scripts]
gmbench-media = "gmbench_media.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gmbench_media"]
