[project]
name = "gmbench"
version = "0.1.0"
description = "GM-Bench: frontier AI models run NHL fantasy franchises (Game Day Suits AI GM League 2026-27)"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "pillow>=12.3.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
gmbench = "gmbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
